apiVersion: apps/v1
kind: Deployment
metadata:
  name: password-v3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: password-v3
  template:
    metadata:
      labels:
        app: password-v3
    spec:
      containers:
        - name: password-manager
          image: YOUR_DOCKERHUB_USERNAME/password-manager:v3
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "v3"
---
apiVersion: v1
kind: Service
metadata:
  name: password-v3-service
spec:
  type: NodePort
  selector:
    app: password-v3
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30003
